name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Test
        run: go test ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for os in darwin linux; do
            for arch in amd64 arm64; do
              out="dist/tsync_${os}_${arch}"
              mkdir -p "$out/packaging"
              GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
                go build -trimpath -ldflags="-s -w -X main.version=$VERSION" -o "$out/tsync" .
              cp install.sh "$out/install.sh"
              cp packaging/*.in "$out/packaging/"
              tar -C "$out" -czf "dist/tsync_${os}_${arch}.tar.gz" .
              rm -rf "$out"
            done
          done
          cd dist
          sha256sum tsync_*.tar.gz > checksums.txt
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tsync_*.tar.gz
            dist/checksums.txt
